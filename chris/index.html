<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="fallback" hidden></div>

<div id="loader" aria-hidden="true"><i></i></div>

<div id="hud">
  <ol id="progress" aria-label="Progress"></ol>
  <button id="mute" type="button" aria-label="Mute music" aria-pressed="false" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path class="on" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/><path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/>
    </svg>
  </button>
</div>

<div id="title" aria-live="polite"></div>
<div id="caption" aria-live="polite"></div>

<section id="card" aria-live="polite" hidden>
  <figure id="card-photo" hidden><img alt="" decoding="async" draggable="false"></figure>
  <p id="card-date"></p>
  <p id="card-caption"></p>
  <p id="card-hint"></p>
</section>
<i id="leader" aria-hidden="true"></i>

<div id="foot">
  <button id="mic" type="button" hidden></button>
  <p id="hint"></p>
  <button id="next" type="button" hidden><span></span><svg viewBox="0 0 16 10" width="14" height="9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 2l6 6 6-6"/></svg></button>
  <button id="replay" type="button" hidden></button>
</div>

<div id="sr-letter" class="sr-only" aria-live="polite"></div>
<div id="hearts" aria-hidden="true"></div>
<noscript><p class="noscript">This little gift needs JavaScript to open. Please try it in Chrome or Safari.</p></noscript>
